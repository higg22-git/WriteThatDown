name: write_that_down
description: Voice-first mobile idea capture app built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_tts: ^4.2.2
  shared_preferences: ^2.5.2
  speech_to_text: ^7.0.0
  sqflite: ^2.4.1
  path: ^1.9.1
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true